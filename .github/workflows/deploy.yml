name: Deploy

# Manual only. Primeiro da cadeia: infra-k8s -> infra-db -> app -> lambda.
on:
  workflow_dispatch:
    inputs:
      node_instance_type:
        description: "Tipo de instância dos nós EKS"
        type: choice
        required: true
        default: t3.small
        options:
          - t3.small
          - t3.medium
          - t3.large

concurrency:
  group: infra-k8s
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  TF_STATE_KEY: tech-challenge/infra-k8s.tfstate

jobs:
  deploy:
    name: Terraform e addons do cluster
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require master branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "Rode este workflow com a branch master selecionada."
            exit 1
          fi

      - name: Require secrets and variables
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
        run: |
          set -eu
          missing=0
          for name in TF_STATE_BUCKET TF_STATE_LOCK_TABLE NEW_RELIC_LICENSE_KEY NEW_RELIC_API_KEY NEW_RELIC_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} ausente. Defina em Settings > Secrets and variables > Actions (README.md)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform plan
        env:
          NODE_INSTANCE_TYPE: ${{ inputs.node_instance_type }}
          TF_VAR_eks_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS || '[]' }}
          TF_VAR_newrelic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          TF_VAR_newrelic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
          TF_VAR_newrelic_region: ${{ vars.NEW_RELIC_REGION || 'US' }}
          TF_VAR_newrelic_logs_ingest_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          TF_VAR_newrelic_alert_emails: ${{ vars.NEW_RELIC_ALERT_EMAILS }}
        run: |
          terraform plan -var-file=env/aws.tfvars \
            -var="node_instance_types=[\"${NODE_INSTANCE_TYPE}\"]" \
            -out=tfplan -no-color

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Setup Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.21.4

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --name "$(terraform output -raw cluster_name)" --region "${AWS_REGION}"

      - name: Install metrics-server
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update metrics-server
          helm upgrade --install metrics-server metrics-server/metrics-server \
            --namespace kube-system \
            --set args={--kubelet-insecure-tls} \
            --wait --timeout 3m

      - name: Create New Relic license secret
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          set -eu
          kubectl create namespace newrelic --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n newrelic create secret generic newrelic-license \
            --from-literal=license-key="$NEW_RELIC_LICENSE_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install New Relic Kubernetes bundle
        working-directory: .
        run: |
          set -eu
          VERSION="$(tr -d '[:space:]' < charts/newrelic/VERSION)"
          helm repo add newrelic https://helm-charts.newrelic.com
          helm repo update newrelic
          helm upgrade --install newrelic-bundle newrelic/nri-bundle \
            --namespace newrelic --create-namespace \
            --version "$VERSION" \
            -f charts/newrelic/values.yaml \
            --wait --timeout 10m

      - name: Summary
        run: |
          {
            echo "### API Gateway: $(terraform output -raw api_gateway_url)"
            echo
            echo "Parâmetros SSM publicados:"
            terraform output -json ssm_parameters | jq -r '.[] | "- `" + . + "`"'
            echo
            echo "Próximo passo: **Deploy** do tech-challenge-infra-db."
          } >> "$GITHUB_STEP_SUMMARY"
